build:
  stage: build
  rules:
    - when: always

  tags:
    - windows

  script:
    - git submodule init
    - git submodule update

    - mkdir build
    - cd build

    - cmake .. -A x64 -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=RelWithDebInfo

    - cmake --build . --config RelWithDebInfo

  artifacts:
    paths:
      - build/RelWithDebInfo/*.dll
      - build/RelWithDebInfo/*.exe
      - build/RelWithDebInfo/*.pdb